<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Verify it is you</title>
<style>body { font: 14px sans-serif; margin: 16px; } input { display: block; width: 200px; height: 30px; margin: 8px 0; }</style>
</head>
<body>
<!-- A one-time-code page: no password field anywhere, only the code the portal sent the client. -->
<h1>Verify it is you</h1>
<p>Enter the 6-digit code we sent to your phone. OTP-PAGE-TEXT</p>
<label>Code <input id="code" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6"></label>
<button type="button">Verify</button>
</body>
</html>
