<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Section 3 — Labour</title>
<style>body { font: 14px sans-serif; margin: 16px; } textarea { display: block; width: 420px; height: 60px; } iframe { display: block; width: 420px; height: 120px; margin-top: 8px; }</style>
</head>
<body>
<!--
  A questionnaire section that embeds the portal's re-authentication form in a frame: `?cross` loads it from another origin
  (the same fixture server reached as localhost), which Chrome runs in a process of its own; without it, from the portal itself.
-->
<h1>Section 3 — Labour</h1>
<label>Grievance mechanism <textarea id="grievance">FRAME-PAGE-TEXT</textarea></label>
<iframe id="reauth" title="Re-authenticate"></iframe>
<script>
  const cross = new URLSearchParams(location.search).has('cross');
  document.getElementById('reauth').src = cross ? `${location.protocol}//localhost:${location.port}/frame-reauth.html` : 'frame-reauth.html';
</script>
</body>
</html>
