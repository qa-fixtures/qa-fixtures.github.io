<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Section 4 — Governance</title>
<style>body { font: 14px sans-serif; margin: 16px; } textarea { display: block; width: 420px; height: 60px; } x-reauth { display: block; margin-top: 8px; }</style>
</head>
<body>
<!--
  A portal component that keeps its re-authentication field in a shadow root its own script attaches: `?closed` attaches it
  closed, so no outside query reaches it; without it, open.
-->
<h1>Section 4 — Governance</h1>
<label>Board oversight <textarea id="oversight">SHADOW-PAGE-TEXT</textarea></label>
<x-reauth id="host"></x-reauth>
<script>
  const mode = new URLSearchParams(location.search).has('closed') ? 'closed' : 'open';
  customElements.define('x-reauth', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode });
      root.innerHTML = '<label>Password <input id="pw" type="password" style="width:200px;height:28px"></label>';
      window.fillShadowPassword = (value) => { root.getElementById('pw').value = value; };
    }
  });
</script>
</body>
</html>
