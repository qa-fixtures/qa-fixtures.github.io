<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Supplier questionnaire – two sections</title>
<!-- Two sections of one page, switched by "Next section" / "Previous section": section 1 has a typed answer and a
     Save draft; section 2 has a pick (radio), a typed answer and an upload with its own Remove control, for the
     portal assistant's undo checks across a section boundary and a save. No sign-in, no submit. -->
<style>body{font-family:system-ui,sans-serif;max-width:820px;margin:24px auto;color:#1d2b24}section[hidden]{display:none}fieldset{border:1px solid #c8d3cd;border-radius:8px;margin:10px 0}label.block{display:block;font-weight:600;margin:10px 0 4px}input[type=text]{padding:6px;width:60%}button{padding:6px 12px;margin:6px 4px 0 0}</style>
</head><body>
<h1>Supplier questionnaire</h1>
<nav aria-label="Sections"><span id="nav-1">1. Company</span> · <span id="nav-2">2. Environment</span></nav>
<form id="q" onsubmit="return false">
<section id="section-1">
  <h2>1. Company</h2>
  <label class="block" for="legal_name">Legal entity name</label><input type="text" id="legal_name" name="legal_name">
  <label class="block" for="hq">City and country of headquarters</label><input type="text" id="hq" name="hq">
  <div><button type="button" id="save-1">Save draft</button><button type="button" id="next">Next section</button> <span id="saved-1"></span></div>
</section>
<section id="section-2" hidden>
  <h2>2. Environment</h2>
  <fieldset><legend>Do you hold ISO 14001?</legend>
    <label><input type="radio" name="iso" value="yes"> Yes</label>
    <label><input type="radio" name="iso" value="no"> No</label></fieldset>
  <fieldset><legend>Which topics does the environmental policy cover?</legend>
    <label><input type="checkbox" name="topics" value="energy"> Energy consumption</label>
    <label><input type="checkbox" name="topics" value="water"> Water</label>
    <label><input type="checkbox" name="topics" value="waste"> Waste</label></fieldset>
  <label class="block" for="policy_title">Title of the environmental policy document</label><input type="text" id="policy_title" name="policy_title">
  <div class="upload-block">
    <label class="block" for="policy">Upload the environmental policy document</label>
    <input type="file" id="policy" accept=".pdf,.docx">
    <span id="policy-name"></span>
    <button type="button" id="policy-remove" hidden>Remove</button>
  </div>
  <div><button type="button" id="prev">Previous section</button><button type="button" id="save-2">Save draft</button> <span id="saved-2"></span></div>
</section>
</form>
<script>
const show = (n) => { document.getElementById('section-1').hidden = n !== 1; document.getElementById('section-2').hidden = n !== 2; document.getElementById('nav-' + n).style.fontWeight = 'bold'; document.getElementById('nav-' + (3 - n)).style.fontWeight = 'normal'; };
show(1);
document.getElementById('next').addEventListener('click', () => show(2));
document.getElementById('prev').addEventListener('click', () => show(1));
for (const n of [1, 2]) document.getElementById('save-' + n).addEventListener('click', () => { document.getElementById('saved-' + n).textContent = 'Draft saved'; });
const policy = document.getElementById('policy');
policy.addEventListener('change', () => {
  const file = policy.files[0];
  document.getElementById('policy-name').textContent = file ? file.name : '';
  document.getElementById('policy-remove').hidden = !file;
});
document.getElementById('policy-remove').addEventListener('click', () => {
  policy.value = '';
  document.getElementById('policy-name').textContent = '';
  document.getElementById('policy-remove').hidden = true;
});
</script>
</body></html>
