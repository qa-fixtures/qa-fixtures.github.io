<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Verdantis Supplier Portal – Sign in (shared draft)</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f6f4;margin:0;color:#1d2b24}
.card{max-width:380px;margin:80px auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 16px}label{display:block;font-size:13px;margin:12px 0 4px}
input{width:100%;padding:9px;border:1px solid #c8d3cd;border-radius:6px;box-sizing:border-box}
button{margin-top:16px;width:100%;padding:10px;background:#1f7a4d;color:#fff;border:0;border-radius:6px;font-size:15px;cursor:pointer}
.err{color:#b00020;font-size:13px;margin-top:8px;display:none}
#cookie{position:fixed;left:0;right:0;bottom:0;background:#1d2b24;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
#cookie button{width:auto;margin:0;padding:8px 14px;background:#fff;color:#1d2b24}
</style></head><body>
<div class="card"><h1>Verdantis Supplier Sustainability Portal</h1>
<form id="f"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button><div class="err" id="err">Invalid credentials.</div></form></div>
<div id="cookie" role="dialog" aria-label="Cookie consent"><span>We use cookies to improve your experience.</span><button id="acc" type="button">Accept all</button></div>
<script>
document.getElementById('acc').onclick=()=>document.getElementById('cookie').remove();
document.getElementById('f').onsubmit=e=>{e.preventDefault();
 if(document.getElementById('email').value==='supplier@northwind-alloys.example'&&document.getElementById('pw').value==='Demo-2026!'){
  document.cookie='vsd_auth=1; path=/; max-age=2592000';location.href=localStorage.getItem('vsd_next')||'shared-draft.html';}
 else document.getElementById('err').style.display='block';};
</script></body></html>
