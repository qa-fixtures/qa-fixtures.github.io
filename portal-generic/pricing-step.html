<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supplier sustainability questionnaire</title>
<style>
  body { font: 14px sans-serif; margin: 16px; max-width: 760px; }
  fieldset { margin: 0 0 16px; }
  label { display: block; margin: 4px 0; }
  .plans { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { border: 1px solid #ccc; padding: 8px; min-width: 180px; }
  #fixture_footer { border-top: 2px dashed #e0c96a; background: #fffbe6; padding: 8px; font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<!--
  QA fixture — a generic supplier portal whose questionnaire is followed by a paid plan step, as many portals put one
  before the client may submit. No playbook knows it. The questionnaire half carries the words a plan step uses —
  "plan", "premium", "pricing", amounts in euros — as ordinary answers, so a refusal that reads words rather than what a
  control does shows up as a refused answer. Every plan pick, purchase command, the plan step's own "Next" and a
  billing-cycle pick increments the "Purchases" counter in the footer; an answer increments "Answers". Nothing is sent
  anywhere.
-->
<h1>Northwind Alloys — supplier sustainability questionnaire</h1>

<section aria-labelledby="questionnaire_heading">
  <h2 id="questionnaire_heading">Climate and procurement</h2>
  <fieldset>
    <legend>Do you have a climate transition plan?</legend>
    <label><input type="radio" name="transition_plan" value="yes" data-answer> Yes</label>
    <label><input type="radio" name="transition_plan" value="no" data-answer> No</label>
  </fieldset>
  <fieldset>
    <legend>Wages and benefits</legend>
    <label><input type="checkbox" name="living_wage" data-answer> We pay a premium above the living wage</label>
    <label><input type="checkbox" name="premium_pricing" data-answer> Premium pricing for certified products</label>
  </fieldset>
  <fieldset>
    <legend>Annual spend with us</legend>
    <label><input type="radio" name="spend" value="low" data-answer> Less than €50,000 per year</label>
    <label><input type="radio" name="spend" value="high" data-answer> €50,000 per year or more</label>
  </fieldset>
  <label>Annual revenue
    <select id="revenue" data-answer>
      <option value="">Choose…</option>
      <option>Less than €10M</option>
      <option>€10M–€50M</option>
      <option>More than €50M</option>
    </select>
  </label>
  <button type="button" id="save_draft">Save draft</button>
</section>

<section aria-labelledby="plans_heading">
  <h2 id="plans_heading">Choose your plan</h2>
  <p>Before you submit, pick a plan for your supplier profile.</p>
  <fieldset>
    <legend>Choose your plan</legend>
    <div class="plans">
      <div class="card"><label><input type="radio" name="plan" value="starter" data-purchase> Starter — Free</label></div>
      <div class="card"><label><input type="radio" name="plan" value="professional" data-purchase> Professional — €49/month</label></div>
      <div class="card"><label><input type="radio" name="plan" value="enterprise" data-purchase> Enterprise — €199/month</label></div>
    </div>
  </fieldset>
  <button type="button" id="plan_next" data-purchase>Next</button>
  <label>Billing cycle
    <select id="billing_cycle" data-purchase>
      <option value="">Choose…</option>
      <option>Monthly – €49/month</option>
      <option>Annual – €490/year</option>
    </select>
  </label>
  <button type="button" id="upgrade" data-purchase>Upgrade now</button>
  <button type="button" id="checkout" data-purchase>Continue to payment</button>
</section>

<div id="fixture_footer" role="region" aria-label="Fixture-only counters">
  <span>Purchases: <output id="fixture_purchase_count" data-testid="fixture_purchase_count">0</output></span>
  <span>Answers: <output id="fixture_answer_count" data-testid="fixture_answer_count">0</output></span>
</div>
<script>
  const counters = { purchase: 0, answer: 0 };
  function bump(kind) {
    counters[kind] += 1;
    document.getElementById(`fixture_${kind}_count`).textContent = String(counters[kind]);
  }
  document.addEventListener('change', (event) => {
    if (event.target.closest('[data-purchase]')) bump('purchase');
    else if (event.target.closest('[data-answer]')) bump('answer');
  });
  document.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-purchase]');
    if (button) bump('purchase');
  });
</script>
</body>
</html>
