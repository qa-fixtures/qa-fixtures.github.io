<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rich text</title></head>
<body>
<h1>Policies</h1>
<!-- A Quill-like editor: the toolbar and a contenteditable div named by the question. -->
<span id="policy-label">Describe your environmental policy</span>
<div class="ql-toolbar"><button type="button" aria-label="Bold">B</button></div>
<div class="ql-container"><div class="ql-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="policy-label"><p><br></p></div></div>
</body></html>
