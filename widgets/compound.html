<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Compound</title></head>
<body>
<h1>Company Details</h1>
<!-- Jotform-shaped compound fields: one question, several inputs, each named by the question label and a sublabel under it. -->
<form class="jotform-form" onsubmit="return false">
<ul class="form-section page-section">
  <li class="form-line" id="id_10"><label class="form-label" id="label_10">Registered Company Address</label>
    <div class="form-input">
      <span class="form-sub-label-container"><input type="text" id="input_10_addr_line1" name="q10_address[addr_line1]" aria-labelledby="label_10 sublabel_10_addr_line1"><label class="form-sub-label" for="input_10_addr_line1" id="sublabel_10_addr_line1">Street Address</label></span>
      <span class="form-sub-label-container"><input type="text" id="input_10_city" name="q10_address[city]" aria-labelledby="label_10 sublabel_10_city"><label class="form-sub-label" for="input_10_city" id="sublabel_10_city">City</label></span>
      <span class="form-sub-label-container"><input type="text" id="input_10_postal" name="q10_address[postal]" aria-labelledby="label_10 sublabel_10_postal"><label class="form-sub-label" for="input_10_postal" id="sublabel_10_postal">Postal / Zip Code</label></span>
      <span class="form-sub-label-container"><select id="input_10_country" name="q10_address[country]" aria-labelledby="label_10 sublabel_10_country"><option value="">Please Select</option><option>Germany</option><option>United Kingdom</option></select><label class="form-sub-label" for="input_10_country" id="sublabel_10_country">Country</label></span>
    </div></li>
  <li class="form-line" id="id_8"><label class="form-label" id="label_8">Main Telephone Number</label>
    <div class="form-input">
      <span class="form-sub-label-container"><input type="tel" id="input_8_area" name="q8_phone[area]" aria-labelledby="label_8 sublabel_8_area"><label class="form-sub-label" for="input_8_area" id="sublabel_8_area">Country Code</label></span>
      <span class="form-sub-label-container"><input type="tel" id="input_8_phone" name="q8_phone[phone]" aria-labelledby="label_8 sublabel_8_phone"><label class="form-sub-label" for="input_8_phone" id="sublabel_8_phone">Phone Number</label></span>
    </div></li>
  <li class="form-line" id="id_3"><label class="form-label" id="label_3">Date of Incorporation</label>
    <div class="form-input">
      <span class="form-sub-label-container"><input type="tel" id="day_3" name="q3_date[day]" maxlength="2" aria-labelledby="label_3 sublabel_3_day"><label class="form-sub-label" for="day_3" id="sublabel_3_day">Day</label></span>
      <span class="form-sub-label-container"><input type="tel" id="month_3" name="q3_date[month]" maxlength="2" aria-labelledby="label_3 sublabel_3_month"><label class="form-sub-label" for="month_3" id="sublabel_3_month">Month</label></span>
      <span class="form-sub-label-container"><input type="tel" id="year_3" name="q3_date[year]" maxlength="4" aria-labelledby="label_3 sublabel_3_year"><label class="form-sub-label" for="year_3" id="sublabel_3_year">Year</label></span>
    </div></li>
</ul>
</form>
</body></html>
